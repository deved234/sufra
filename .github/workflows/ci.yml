name: CI

on:
  push:
    branches: [main, "ci/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    # A database that exists only for this run. No secrets, and nowhere near the live one.
    services:
      mongo:
        # 8.x won't start on the runners' Linux kernel 6.19+ (SERVER-121912)
        image: mongo:7.0
        ports:
          - 27017:27017

    env:
      MONGODB_URI: mongodb://localhost:27017
      MONGODB_DB: sufra_ci
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Newer npm versions refuse the lock file, which lacks two optional wasm packages
          node-version: 24.13.0
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run check:themes
      - run: npm test

      # Pages are prerendered from the database, so it needs its data before the build
      - name: Set up the database
        run: |
          node --no-warnings tests/db/wait-for-database.mjs
          node --no-warnings scripts/db-setup.mjs
          node --no-warnings scripts/db-seed.mjs

      - run: npm run test:db
      - run: npm run build

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
